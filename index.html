<!DOCTYPE html>
<!-- Car Factory Tycoon — © 2026 Brakeco Games. All rights reserved. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="author" content="Brakeco Games">
  <meta name="copyright" content="© 2026 Brakeco Games">
  <title>Car Factory Tycoon</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Your car factory"></canvas>

  <!-- HUD -->
  <header id="hud">
    <div class="money-box">
      <div id="money" class="money">€0</div>
      <div id="ipm" class="ipm">$0 / min</div>
    </div>
    <div class="hud-chips">
      <div class="chip" title="Cars produced">🚗 <b id="carsCount">0</b></div>
      <button class="chip chip-btn" id="modelChip" title="Current car model"><span id="modelName">Mini Mo</span> <span id="modelStars" class="stars">★</span></button>
    </div>
    <div class="hud-right">
      <button id="boostBtn" class="boost-btn" title="2× production speed">⚡ <span id="boostLabel">2× Turbo</span></button>
      <button id="soundBtn" class="icon-btn" title="Sound on/off">🔊</button>
      <button id="saveBtn" class="icon-btn" title="Save (Ctrl+S)">💾</button>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
    </div>
  </header>

  <!-- missie + volgende ontgrendeling -->
  <div id="sideCards">
    <div id="missionCard" class="card mission">
      <div class="mission-top"><span class="tag">🎯 Mission <span id="missionNum">1</span></span><span id="missionReward" class="reward">+$15</span></div>
      <div id="missionText" class="mission-text">Produce your first car</div>
      <div class="bar"><i id="missionBar"></i></div>
      <button id="missionClaim" class="claim-btn" hidden>Claim reward!</button>
    </div>
    <div id="nextCard" class="card next">
      <div class="next-top"><span id="nextIcon">⚙️</span> <span id="nextText">Next: Engine Assembly</span></div>
      <div class="bar small"><i id="nextBar"></i></div>
    </div>
  </div>

  <div id="camPad" class="cam-pad">
    <button id="rotL" class="rot-btn" title="Rotate camera left">⟲</button>
    <button id="rotR" class="rot-btn" title="Rotate camera right">⟳</button>
    <button id="zoomIn" title="Zoom in">＋</button>
    <button id="zoomOut" title="Zoom out">－</button>
    <button id="fitBtn" title="Show whole factory">⤢</button>
  </div>
  <button id="vipBtn" class="vip-btn" hidden>🤵 <span>VIP buyer waiting!</span> <b id="vipAmt"></b><i id="vipTimer"></i></button>
  <div id="hint" class="hint" hidden></div>
  <div id="toasts"></div>

  <!-- onderbalk -->
  <div id="bottom">
    <div id="actionRow">
      <button id="sellAllBtn" class="sellall-btn" hidden>💰 Sell all <b id="sellAllAmt"></b></button>
      <button id="produceBtn" class="produce-btn">
        <svg viewBox="0 0 100 100" class="ring"><circle cx="50" cy="50" r="45" class="ring-bg"/><circle id="produceRing" cx="50" cy="50" r="45" class="ring-fg"/></svg>
        <span class="produce-icon">🚗</span>
        <span class="produce-label" id="produceLabel">PRODUCE</span>
      </button>
    </div>
    <nav id="tabs">
      <button data-tab="stations"><span class="ti">🏭</span><span class="tl">Factory</span><i class="badge" hidden></i></button>
      <button data-tab="upgrades"><span class="ti">⬆️</span><span class="tl">Upgrades</span><i class="badge" hidden></i></button>
      <button data-tab="models"><span class="ti">🚘</span><span class="tl">Models</span><i class="badge" hidden></i></button>
      <button data-tab="missions"><span class="ti">🎯</span><span class="tl">Missions</span><i class="badge" hidden></i></button>
      <button data-tab="achievements"><span class="ti">🏆</span><span class="tl">Awards</span><i class="badge" hidden></i></button>
    </nav>
  </div>

  <!-- paneel -->
  <section id="panel" class="closed" aria-live="polite">
    <div class="panel-head">
      <h2 id="panelTitle">Factory</h2>
      <div id="buyMode" class="buy-mode" hidden>
        <button data-mode="1" class="on">×1</button><button data-mode="10">×10</button><button data-mode="max">MAX</button>
      </div>
      <button id="panelClose" class="icon-btn" title="Close">✕</button>
    </div>
    <div id="panelBody" class="panel-body"></div>
  </section>

  <!-- modaal -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" id="modalBox"></div>
  </div>

  <!-- test-advertentie (alleen lokaal) -->
  <div id="adOverlay" class="ad-overlay" hidden>
    <div class="ad-box"><div class="ad-tag">Test mode</div><div>📺 Ad playing…</div><div class="ad-count" id="adCount">3</div><small>On CrazyGames a real ad plays here.</small></div>
  </div>

  <div id="loading" class="loading">
    <div class="logo"><span>🏭</span><h1>Car Factory<br><em>Tycoon</em></h1></div>
    <div class="load-bar"><i id="loadBar"></i></div>
    <p id="loadText">Starting the factory…</p>
    <p class="copyright">© 2026 Brakeco Games</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="js/audio.js"></script>
<script src="js/sdk.js"></script>
<script src="js/three.min.js"></script>
<script src="js/render.js"></script>
<script src="js/render3d.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
